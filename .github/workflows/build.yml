name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-liberation
      - run: pip install -r requirements.txt
      - run: bash tests/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sample-reels
          path: sample_reels/*.mp4
