name: mac-app
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/mac-app.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 libxcb-cursor0 espeak-ng
      - run: pip install -r desktop/requirements-app.txt faster-whisper
      - name: Engine + UI self-test
        working-directory: desktop
        run: QT_QPA_PLATFORM=offscreen python -m reelscutter --selftest
      - name: Full pipeline test with real speech recognition (tiny model)
        working-directory: desktop
        run: QT_QPA_PLATFORM=offscreen python tests/test_pipeline.py --speech
      - name: Auto-posting test (fake Ayrshare)
        working-directory: desktop
        run: python tests/test_posting.py
      - name: Autopilot test (folder to posted clips, fake Ayrshare)
        working-directory: desktop
        run: python tests/test_autopilot.py
      - name: Jasper Bot test (scripted stand-in for Claude)
        working-directory: desktop
        run: QT_QPA_PLATFORM=offscreen python tests/test_bot.py
      - name: Timeline Editor test (first frame, mark, save, export)
        working-directory: desktop
        run: QT_QPA_PLATFORM=offscreen python tests/test_editor.py
  build:
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel   # Intel x86_64 (primary target)
          - runner: macos-15         # Apple Silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash desktop/packaging/build_mac.sh
      - name: Built app plays video (first frames decode in the bundled player)
        run: QT_QPA_PLATFORM=offscreen "desktop/dist/Reels Cutter.app/Contents/MacOS/Reels Cutter" --playtest
      - uses: actions/upload-artifact@v4
        with:
          name: ReelsCutter-${{ matrix.runner }}
          path: desktop/dist/*.dmg
      - name: Publish to the "desktop-latest" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest --title "Reels Cutter for Mac (latest build)" --notes "Download the .dmg for your Mac: x86_64 = Intel, arm64 = Apple Silicon." --latest || true
          gh release upload desktop-latest desktop/dist/*.dmg --clobber
